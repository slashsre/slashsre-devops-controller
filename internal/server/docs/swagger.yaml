basePath: /
definitions:
  posttest.FluxEvent:
    properties:
      involvedObject:
        properties:
          kind:
            type: string
          name:
            type: string
          namespace:
            type: string
        type: object
      message:
        type: string
      reason:
        type: string
      severity:
        type: string
    type: object
  remediation.Alert:
    properties:
      annotations:
        additionalProperties:
          type: string
        type: object
      endsAt:
        type: string
      fingerprint:
        type: string
      labels:
        additionalProperties:
          type: string
        type: object
      startsAt:
        type: string
      status:
        type: string
    type: object
  remediation.WebhookMessage:
    properties:
      alerts:
        items:
          $ref: '#/definitions/remediation.Alert'
        type: array
      groupKey:
        type: string
      receiver:
        type: string
      status:
        type: string
      version:
        type: string
    type: object
  server.ErrorBody:
    properties:
      code:
        type: integer
      message:
        type: string
    type: object
  server.FluxResponse:
    properties:
      started:
        type: integer
    type: object
  server.ResourcesResponse:
    properties:
      alertRemediations:
        items:
          type: object
        type: array
      nodeLifecycleRules:
        description: Items are full Kubernetes objects; see the CRD schemas for their
          fields.
        items:
          type: object
        type: array
      postDeployTests:
        items:
          type: object
        type: array
      queueTriggeredJobs:
        items:
          type: object
        type: array
    type: object
  server.RunResponse:
    properties:
      jobName:
        type: string
      pipelineID:
        type: string
      pipelineURL:
        type: string
    type: object
  server.RuntimeResponse:
    properties:
      goarch:
        type: string
      goos:
        type: string
      hostname:
        type: string
      message:
        type: string
      num_cpu:
        type: integer
      num_goroutine:
        type: integer
      revision:
        type: string
      runtime:
        type: string
      version:
        type: string
    type: object
info:
  contact:
    name: Source Code
    url: https://github.com/slashsre/slashsre-devops-controller
  description: Kubernetes controller for node lifecycle, queue-triggered jobs, alert
    remediation and post-deploy tests.
  title: slashsre-devops-controller API
  version: "1.0"
paths:
  /api/info:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/server.RuntimeResponse'
      summary: Runtime information
      tags:
      - API
  /api/v1/namespaces/{namespace}/postdeploytests/{name}/run:
    post:
      description: Starts the Job and/or pipeline of a PostDeployTest immediately,
        ignoring cooldown.
      parameters:
      - description: Namespace
        in: path
        name: namespace
        required: true
        type: string
      - description: PostDeployTest name
        in: path
        name: name
        required: true
        type: string
      produces:
      - application/json
      responses:
        "202":
          description: Accepted
          schema:
            $ref: '#/definitions/server.RunResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/server.ErrorBody'
        "502":
          description: Bad Gateway
          schema:
            $ref: '#/definitions/server.ErrorBody'
      security:
      - BearerAuth: []
      summary: Run a PostDeployTest
      tags:
      - API
  /api/v1/namespaces/{namespace}/queuetriggeredjobs/{name}/run:
    post:
      description: Creates a Job for a QueueTriggeredJob immediately, ignoring queue
        depth.
      parameters:
      - description: Namespace
        in: path
        name: namespace
        required: true
        type: string
      - description: QueueTriggeredJob name
        in: path
        name: name
        required: true
        type: string
      produces:
      - application/json
      responses:
        "202":
          description: Accepted
          schema:
            $ref: '#/definitions/server.RunResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/server.ErrorBody'
      security:
      - BearerAuth: []
      summary: Run a QueueTriggeredJob
      tags:
      - API
  /api/v1/resources:
    get:
      description: Lists all slashsre.controller.io resources with their status.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/server.ResourcesResponse'
      summary: List resources
      tags:
      - API
  /healthz:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Liveness check
      tags:
      - Health
  /readyz:
    get:
      description: Ready once the Kubernetes informer cache has synced.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Readiness check
      tags:
      - Health
  /version:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Version
      tags:
      - API
  /webhooks/alertmanager:
    post:
      consumes:
      - application/json
      description: Receives Alertmanager notifications and runs matching AlertRemediation
        actions.
      parameters:
      - description: Alertmanager webhook payload
        in: body
        name: payload
        required: true
        schema:
          $ref: '#/definitions/remediation.WebhookMessage'
      responses:
        "200":
          description: No matching rule
          schema:
            type: string
        "202":
          description: Remediation started
          schema:
            type: string
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/server.ErrorBody'
      security:
      - BearerAuth: []
      summary: Alertmanager webhook
      tags:
      - Webhooks
  /webhooks/flux:
    post:
      consumes:
      - application/json
      description: Receives Flux notification-controller events (generic provider)
        and starts matching PostDeployTests.
      parameters:
      - description: Flux event
        in: body
        name: payload
        required: true
        schema:
          $ref: '#/definitions/posttest.FluxEvent'
      responses:
        "202":
          description: Accepted
          schema:
            $ref: '#/definitions/server.FluxResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/server.ErrorBody'
      security:
      - BearerAuth: []
      summary: Flux notification webhook
      tags:
      - Webhooks
securityDefinitions:
  BearerAuth:
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
