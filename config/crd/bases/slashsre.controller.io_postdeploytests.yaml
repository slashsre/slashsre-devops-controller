---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.18.0
  name: postdeploytests.slashsre.controller.io
spec:
  group: slashsre.controller.io
  names:
    categories:
    - slashsre
    kind: PostDeployTest
    listKind: PostDeployTestList
    plural: postdeploytests
    shortNames:
    - pdt
    singular: postdeploytest
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .status.runs
      name: Runs
      type: integer
    - jsonPath: .status.lastRunTime
      name: Last Run
      type: date
    - jsonPath: .status.lastError
      name: Error
      priority: 1
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: PostDeployTest runs a Job and/or an external pipeline after a
          deployment.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: PostDeployTestSpec defines tests that run after a deployment.
            properties:
              cooldown:
                default: 1m
                description: Cooldown is the minimum time between two runs.
                type: string
              job:
                description: Job to run inside the cluster.
                properties:
                  cronJobRef:
                    description: CronJobRef copies the job template of an existing
                      CronJob in the same namespace.
                    properties:
                      name:
                        description: Name of the referenced object.
                        minLength: 1
                        type: string
                    required:
                    - name
                    type: object
                  template:
                    description: Template is an inline Job template.
                    type: object
                    x-kubernetes-preserve-unknown-fields: true
                  ttlSecondsAfterFinished:
                    default: 3600
                    description: TTLSecondsAfterFinished is applied to created Jobs
                      so they are garbage collected.
                    format: int32
                    minimum: 0
                    type: integer
                type: object
                x-kubernetes-validations:
                - message: exactly one of cronJobRef or template must be set
                  rule: has(self.cronJobRef) != has(self.template)
              pipeline:
                description: Pipeline to trigger in an external CI system.
                properties:
                  baseURL:
                    description: BaseURL overrides the API endpoint (GitHub Enterprise,
                      proxies).
                    type: string
                  credentialsSecretRef:
                    description: |-
                      CredentialsSecretRef is a Secret in the same namespace. GitHub uses the key
                      "token"; Bitbucket uses "token" (bearer) or "username" + "password".
                    properties:
                      name:
                        description: Name of the referenced object.
                        minLength: 1
                        type: string
                    required:
                    - name
                    type: object
                  pipeline:
                    description: |-
                      Pipeline is the GitHub workflow file name/ID (required for github) or the
                      Bitbucket custom pipeline name (optional; the default branch pipeline runs otherwise).
                    type: string
                  provider:
                    description: Provider of the CI system.
                    enum:
                    - github
                    - bitbucket
                    type: string
                  ref:
                    default: main
                    description: Ref is the branch or tag to run on.
                    type: string
                  repository:
                    description: Repository as "<owner>/<repo>" (GitHub) or "<workspace>/<repo>"
                      (Bitbucket).
                    pattern: ^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$
                    type: string
                  variables:
                    additionalProperties:
                      type: string
                    description: Variables passed as workflow inputs (GitHub) or pipeline
                      variables (Bitbucket).
                    type: object
                required:
                - credentialsSecretRef
                - provider
                - repository
                type: object
              suspend:
                description: Suspend disables automatic triggers.
                type: boolean
              trigger:
                description: |-
                  Trigger that starts the tests. Without trigger the tests only run on demand
                  through the API.
                properties:
                  flux:
                    description: Flux notification events.
                    properties:
                      kind:
                        description: Kind of the involved Flux object (Kustomization,
                          HelmRelease, ...).
                        type: string
                      messageContains:
                        description: |-
                          MessageContains requires the event message to contain this substring
                          (for example "Health check passed").
                        type: string
                      name:
                        description: Name of the involved Flux object.
                        type: string
                      namespace:
                        description: Namespace of the involved Flux object.
                        type: string
                      reasons:
                        description: Reasons the event must have (for example Progressing,
                          ReconciliationSucceeded).
                        items:
                          type: string
                        type: array
                    type: object
                type: object
            type: object
            x-kubernetes-validations:
            - message: at least one of job or pipeline must be set
              rule: has(self.job) || has(self.pipeline)
          status:
            description: PostDeployTestStatus defines the observed state of PostDeployTest.
            properties:
              lastError:
                description: LastError of the last run, if it failed.
                type: string
              lastJobName:
                description: LastJobName is the Job created on the last run.
                type: string
              lastPipelineURL:
                description: LastPipelineURL links to the pipeline started on the
                  last run.
                type: string
              lastRunTime:
                description: LastRunTime is the last time the tests were started.
                format: date-time
                type: string
              lastTrigger:
                description: LastTrigger describes what started the last run.
                type: string
              runs:
                description: Runs counts started runs.
                format: int64
                type: integer
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
