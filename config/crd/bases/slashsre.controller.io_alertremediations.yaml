---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.18.0
  name: alertremediations.slashsre.controller.io
spec:
  group: slashsre.controller.io
  names:
    categories:
    - slashsre
    kind: AlertRemediation
    listKind: AlertRemediationList
    plural: alertremediations
    shortNames:
    - arem
    singular: alertremediation
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.alertName
      name: Alert
      type: string
    - jsonPath: .spec.action
      name: Action
      type: string
    - jsonPath: .status.remediations
      name: Remediations
      type: integer
    - jsonPath: .status.lastRemediationTime
      name: Last
      type: date
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: AlertRemediation restarts workloads in response to Alertmanager
          alerts.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: |-
              AlertRemediationSpec matches Alertmanager alerts and remediates the affected pod.
              Only pods in the same namespace as the AlertRemediation are acted upon.
            properties:
              action:
                default: DeletePod
                description: Action to execute.
                enum:
                - DeletePod
                - RolloutRestart
                type: string
              alertName:
                description: AlertName must equal the alert's "alertname" label.
                minLength: 1
                type: string
              cooldown:
                default: 5m
                description: Cooldown is the minimum time between two remediations
                  of the same target.
                type: string
              matchLabels:
                additionalProperties:
                  type: string
                description: |-
                  MatchLabels must all be present with equal values in the alert labels
                  (for example container: my-service).
                type: object
              podLabel:
                default: pod
                description: PodLabel is the alert label holding the pod name.
                type: string
              suspend:
                description: Suspend disables the rule.
                type: boolean
              threshold:
                description: |-
                  Threshold, when set, is compared against the alert annotation named by
                  valueAnnotation. Both values may carry a trailing "%". The action runs when
                  value >= threshold.
                pattern: ^[0-9]+(\.[0-9]+)?%?$
                type: string
              valueAnnotation:
                default: value
                description: ValueAnnotation is the alert annotation holding the measured
                  value.
                type: string
            required:
            - alertName
            type: object
          status:
            description: AlertRemediationStatus defines the observed state of AlertRemediation.
            properties:
              lastError:
                description: LastError is the error of the last failed remediation,
                  if any.
                type: string
              lastRemediationTime:
                description: LastRemediationTime is the last time an action was executed.
                format: date-time
                type: string
              lastTarget:
                description: LastTarget is the object acted upon last (kind/name).
                type: string
              remediations:
                description: Remediations counts successful actions.
                format: int64
                type: integer
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
