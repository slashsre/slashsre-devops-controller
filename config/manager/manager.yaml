apiVersion: apps/v1
kind: Deployment
metadata:
  name: slashsre-devops-controller
  labels:
    app.kubernetes.io/name: slashsre-devops-controller
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: slashsre-devops-controller
  template:
    metadata:
      labels:
        app.kubernetes.io/name: slashsre-devops-controller
    spec:
      serviceAccountName: slashsre-devops-controller
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: controller
        image: controller
        args:
        - --leader-elect
        env:
        - name: DEVOPS_LEADER_ELECTION_NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
        # Optional bearer tokens for the API and webhooks:
        # - name: DEVOPS_API_TOKEN
        #   valueFrom: {secretKeyRef: {name: slashsre-devops-controller, key: api-token}}
        # - name: DEVOPS_WEBHOOK_TOKEN
        #   valueFrom: {secretKeyRef: {name: slashsre-devops-controller, key: webhook-token}}
        ports:
        - name: http
          containerPort: 9898
        livenessProbe:
          httpGet: {path: /healthz, port: http}
          initialDelaySeconds: 10
        readinessProbe:
          httpGet: {path: /readyz, port: http}
          initialDelaySeconds: 5
        resources:
          requests: {cpu: 50m, memory: 64Mi}
          limits: {memory: 256Mi}
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop: ["ALL"]
      terminationGracePeriodSeconds: 30
---
apiVersion: v1
kind: Service
metadata:
  name: slashsre-devops-controller
  labels:
    app.kubernetes.io/name: slashsre-devops-controller
spec:
  selector:
    app.kubernetes.io/name: slashsre-devops-controller
  ports:
  - name: http
    port: 9898
    targetPort: http
